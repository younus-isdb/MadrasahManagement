<div class="exam-fee-edit-container">
  <h2>Edit Exam Fee Collection</h2>

  <form [formGroup]="examFeeForm" (ngSubmit)="onSubmit()">

    <!-- Education Year -->
    <div class="form-group">
      <label>Education Year</label>
      <input type="text" formControlName="educationYear" placeholder="e.g. 2025-2026" />
      <small class="error" *ngIf="examFeeForm.get('educationYear')?.touched && examFeeForm.get('educationYear')?.invalid">
        Education Year is required (max 10 chars)
      </small>
    </div>

    <!-- Department -->
    <div class="form-group">
      <label>Department</label>
      <select formControlName="departmentId">
        <option value="">-- Select Department --</option>
        <option *ngFor="let d of departments()" [value]="d.id">
          {{ d.name }}
        </option>
      </select>
      <small class="error" *ngIf="examFeeForm.get('departmentId')?.touched && examFeeForm.get('departmentId')?.invalid">
        Department is required
      </small>
    </div>

    <!-- Class -->
    <div class="form-group">
      <label>Class</label>
      <select formControlName="classId">
        <option value="">-- Select Class --</option>
        <option *ngFor="let c of classes()" [value]="c.id">
          {{ c.name }}
        </option>
      </select>
      <small class="error" *ngIf="examFeeForm.get('classId')?.touched && examFeeForm.get('classId')?.invalid">
        Class is required
      </small>
    </div>

    <!-- Exam -->
    <div class="form-group">
      <label>Exam</label>
      <select formControlName="examId">
        <option value="">-- Select Exam --</option>
        <option *ngFor="let e of exams()" [value]="e.id">
          {{ e.name }}
        </option>
      </select>
      <small class="error" *ngIf="examFeeForm.get('examId')?.touched && examFeeForm.get('examId')?.invalid">
        Exam is required
      </small>
    </div>

    <!-- Exam Amount -->
    <div class="form-group">
      <label>Exam Amount</label>
      <input type="number" formControlName="examAmount" min="0" />
      <small class="error" *ngIf="examFeeForm.get('examAmount')?.touched && examFeeForm.get('examAmount')?.invalid">
        Amount must be ≥ 0
      </small>
    </div>

    <!-- Fee Collection -->
    <div formArrayName="feeCollections" class="fee-collections">
      <h3>Student Fee Collections</h3>

      <div *ngFor="let fee of feeCollections.controls; let i = index"
           [formGroupName]="i"
           class="fee-row">

        <!-- Student -->
        <select formControlName="studentId">
          <option value="">-- Select Student --</option>
          <option *ngFor="let s of students()" [value]="s.studentId">
            {{ s.name }}
          </option>
        </select>
        <small class="error" *ngIf="fee.get('studentId')?.touched && fee.get('studentId')?.invalid">
          Student is required
        </small>

        <!-- Fee Amount -->
        <input type="number" formControlName="examFeeAmount" placeholder="Fee Amount" min="0" />
        <small class="error" *ngIf="fee.get('examFeeAmount')?.touched && fee.get('examFeeAmount')?.invalid">
          Invalid fee amount
        </small>

        <!-- Total Subjects -->
        <input type="number" formControlName="totalSubject" placeholder="Subjects" min="1" />
        <small class="error" *ngIf="fee.get('totalSubject')?.touched && fee.get('totalSubject')?.invalid">
          Minimum 1 subject
        </small>

        <!-- Remove -->
        <button type="button"
                class="btn-remove"
                (click)="removeStudentFee(i)"
                [disabled]="feeCollections.length === 1">
          Remove
        </button>
      </div>

      <!-- Add -->
      <button type="button" class="btn-add" (click)="addStudentFee()">
        + Add Student
      </button>
    </div>

    <!-- Submit -->
    <div class="form-group submit-btn">
      <button type="submit" [disabled]="loading()">
        {{ loading() ? 'Updating...' : 'Update Exam Fee Collection' }}
      </button>
    </div>

  </form>
</div>
