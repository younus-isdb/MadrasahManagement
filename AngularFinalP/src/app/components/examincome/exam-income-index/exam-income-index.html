<h3>Exam Income & Expense</h3>

<a routerLink="/examincomecreate" class="btn btn-primary mb-2">
  + Add New
</a>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>#</th>
      <th>Exam</th>
      <th>Type</th>
      <th>Amount</th>
      <th width="150">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of list; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ item.examName }}</td>
      <td>{{ item.typesOfExpense }}</td>
      <td>{{ item.amount }}</td>
      <td>
        <a [routerLink]="['/exam-income-expense/edit', item.incomeExpenseId]"
           class="btn btn-sm btn-warning me-1">Edit</a>

        <button (click)="delete(item.incomeExpenseId)"
                class="btn btn-sm btn-danger">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
