<div class="container mt-5" style="max-width: 500px;">
  <h2 class="mb-4">Register</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" id="username" class="form-control"
             [(ngModel)]="model().userName" name="userName" required>
    </div>

    <div class="mb-3">
      <label for="fullname" class="form-label">Full Name</label>
      <input type="text" id="fullname" class="form-control"
             [(ngModel)]="model().fullName" name="fullName">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-control"
             [(ngModel)]="model().email" name="email">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-control"
             [(ngModel)]="model().password" name="password" required>
    </div>

    <div class="mb-3">
      <label for="comparePassword" class="form-label">Confirm Password</label>
      <input type="password" id="comparePassword" class="form-control"
             [(ngModel)]="model().comparePassword" name="comparePassword" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>
