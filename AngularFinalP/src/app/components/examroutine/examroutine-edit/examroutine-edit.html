<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>Edit Exam Routine (ID: {{examRoutineId}})</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="row">
          <div class="col-md-4">
            <label>Session / Year</label>
            <input type="text" class="form-control" formControlName="educationYear">
          </div>
          <div class="col-md-4">
            <label>Class</label>
            <select class="form-control" formControlName="classId">
              <option *ngFor="let c of classes()" [value]="c.classId">{{c.className}}</option>
            </select>
          </div>
          <div class="col-md-4">
            <label>Examination</label>
            <select class="form-control" formControlName="examId">
              <option *ngFor="let e of exams()" [value]="e.examId">{{e.examName}}</option>
            </select>
          </div>
        </div>

        <hr>

        <h5>Subject Schedules</h5>
        <div formArrayName="subjects">
          <div *ngFor="let item of subjectsArray.controls; let i = index" [formGroupName]="i" class="border p-3 mb-3 bg-light">
            <div class="row">
              <div class="col-md-3">
                <label>Subject</label>
                <select class="form-control" formControlName="subjectId">
                  <option *ngFor="let s of subjects()" [value]="s.subjectId">{{s.subjectName}}</option>
                </select>
              </div>
              <div class="col-md-2">
                <label>Room</label>
                <input type="number" class="form-control" formControlName="roomNumber">
              </div>
              <div class="col-md-2">
                <label>Date</label>
                <input type="date" class="form-control" formControlName="examDate">
              </div>
              <div class="col-md-2">
                <label>Day</label>
                <input type="text" class="form-control" formControlName="examDay">
              </div>
              <div class="col-md-2">
                <label>Start - End Time</label>
                <div class="d-flex">
                  <input type="text" class="form-control" formControlName="examStartTime" placeholder="10:00 AM">
                  <input type="text" class="form-control" formControlName="examEndTime" placeholder="12:00 PM">
                </div>
              </div>
              <div class="col-md-1 d-flex align-items-end">
                <button type="button" class="btn btn-danger" (click)="removeSubject(i)">×</button>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-3">
          <button type="button" class="btn btn-secondary me-2" (click)="addSubject()">+ Add Another Subject</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading()">
            {{ loading() ? 'Saving...' : 'Save Changes' }}
          </button>
          <button type="button" class="btn btn-outline-dark ms-2" routerLink="/examroutine">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
