<div class="container mt-4">
  <form [formGroup]="form" (ngSubmit)="submit()" class="card shadow-sm p-4">
    <h3 class="mb-4">Create Exam Routine</h3>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>Session</label>
        <input formControlName="educationYear" class="form-control" placeholder="2024-2025">
      </div>
      <div class="col-md-4">
        <label>Class</label>
        <select formControlName="classId" class="form-select">
          <option *ngFor="let c of classes()" [value]="c.classId">{{ c.className }}</option>
        </select>
      </div>
      <div class="col-md-4">
        <label>Exam</label>
        <select formControlName="examId" class="form-select">
          <option *ngFor="let e of exams()" [value]="e.examId">{{ e.examName }}</option>
        </select>
      </div>
    </div>

    <div formArrayName="subjects">
      <div *ngFor="let s of subjectsArray.controls; let i = index" [formGroupName]="i" class="row g-2 mb-2 align-items-end border-bottom pb-2">
        <div class="col-md-3">
          <label *ngIf="i==0">Subject</label>
          <select formControlName="subjectId" class="form-select">
            <option *ngFor="let sub of subjects()" [value]="sub.subjectId">{{ sub.subjectName }}</option>
          </select>
        </div>
        <div class="col-md-1">
          <label *ngIf="i==0">Room</label>
          <input type="number" formControlName="roomNumber" class="form-control">
        </div>
        <div class="col-md-2">
          <label *ngIf="i==0">Date</label>
          <input type="date" formControlName="examDate" class="form-control">
        </div>
        <div class="col-md-2">
          <label *ngIf="i==0">Day</label>
          <input formControlName="examDay" class="form-control" placeholder="Friday">
        </div>
        <div class="col-md-3">
          <label *ngIf="i==0">Time</label>
          <div class="input-group">
            <input type="time" formControlName="examStartTime" class="form-control">
            <input type="time" formControlName="examEndTime" class="form-control">
          </div>
        </div>
        <div class="col-md-1">
          <button type="button" (click)="removeSubject(i)" class="btn btn-outline-danger w-100">×</button>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button type="button" (click)="addSubject()" class="btn btn-secondary">+ Add Subject</button>
      <button type="submit" class="btn btn-primary float-end" [disabled]="loading()">Save Routine</button>
    </div>
  </form>
</div>
