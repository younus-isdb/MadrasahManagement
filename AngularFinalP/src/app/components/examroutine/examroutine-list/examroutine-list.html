<div class="container mt-4">
  <div class="d-flex justify-content-between mb-4">
    <h2>Exam Routines</h2>
    <a routerLink="/routinecreate" class="btn btn-success">+ New Routine</a>
  </div>

  <div *ngFor="let m of Routines()" class="card mb-4 shadow-sm border-0">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
      <h5 class="mb-0">{{ m.examName }} - Class {{ m.className }} ({{ m.educationYear }})</h5>
      <div>
        <button class="btn btn-sm btn-light me-2" (click)="editExam(m.examRoutineId)">Edit</button>
        <button class="btn btn-sm btn-danger" (click)="deleteExamRoutine(m.examRoutineId)">Delete</button>
      </div>
    </div>
    <div class="card-body p-0 text-center">
      <table class="table table-hover mb-0">
        <thead class="table-light text-uppercase small">
          <tr>
            <th>Subject</th>
            <th>Room</th>
            <th>Date</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of m.subjects">
            <td class="fw-bold">{{ s.subjectName }}</td>
            <td><span class="badge bg-secondary px-3">{{ s.roomNumber }}</span></td>
            <td>{{ s.examDate | date:'yyyy-MM-dd' }}</td>
            <td>{{ s.examStartTime }} - {{ s.examEndTime }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
